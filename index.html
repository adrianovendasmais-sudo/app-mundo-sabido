<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B5BDB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mundo Sabido">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Mundo Sabido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho fixo com estrelas, home com 5 áreas, telas de jogo em coluna única com cartão grande + botões grandes. */
:root{
  --bg:#EEF2FF; --surface:#FFFFFF; --ink:#1B2447; --muted:#56608E; --line:#D0D8F4; --soft:#E4EAFF;
  --on-c:#FFFFFF;
  --c-letras:#3B5BDB; --c-leitura:#7048E8; --c-contas:#D6336C; --c-puzzle:#0B8F68; --c-ingles:#D9480F; --c-mente:#0C8599;
  --good:#2B9348; --bad:#C2255C; --ok-bg:#D3F9D8; --no-bg:#FFDEEB; --star:#FFC21A;
  --paper:#FFFFFF; --paper-ink:#1D2433; --paper-mute:#5B6478; --paper-line:#CBD2E0; --paper-soft:#F1F4FA; --paper-bar:#3B5BDB; --paper-good:#1E7B3A; --paper-mid:#8A5A00; --paper-low:#B42343;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11173A; --surface:#1C2557; --ink:#EDF0FF; --muted:#A9B3E6; --line:#33408A; --soft:#26316F;
    --on-c:#10163A;
    --c-letras:#8EA2FF; --c-leitura:#B197FF; --c-contas:#FF8AB4; --c-puzzle:#38D9A9; --c-ingles:#FFA94D; --c-mente:#3BC9DB;
    --good:#69DB7C; --bad:#FF8AB4; --ok-bg:#17422E; --no-bg:#51213A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11173A; --surface:#1C2557; --ink:#EDF0FF; --muted:#A9B3E6; --line:#33408A; --soft:#26316F;
  --on-c:#10163A;
  --c-letras:#8EA2FF; --c-leitura:#B197FF; --c-contas:#FF8AB4; --c-puzzle:#38D9A9; --c-ingles:#FFA94D; --c-mente:#3BC9DB;
  --good:#69DB7C; --bad:#FF8AB4; --ok-bg:#17422E; --no-bg:#51213A;
  color-scheme:dark;
}
/* temas: algodão-doce (menina) e aventura (menino) */
:root[data-skin="algodao"]{
  --bg:#FFE4F0; --bg2:#FFD0E4; --bg-img:linear-gradient(180deg,var(--bg),var(--bg2));
  --surface:#FFF8FB; --ink:#5A1F42; --muted:#98587A; --line:#F6BFD8; --soft:#FFD6E8;
  --c-letras:#D6408F; --c-leitura:#A83FB5; --c-contas:#E8606E; --c-puzzle:#BE2A6E; --c-ingles:#EE5C98; --c-mente:#D9437E;
  --glyph-r:50%; --r:30px;
}
:root[data-skin="aventura"]{
  --bg:#E1F0FF; --bg2:#F1F7FF; --bg-img:linear-gradient(180deg,var(--bg),var(--bg2));
  --ink:#0B2545; --muted:#486485; --line:#BCD5F0; --soft:#D2E6FA;
  --c-letras:#1864AB; --c-leitura:#5F3DC4; --c-contas:#E03131; --c-puzzle:#2B8A3E; --c-ingles:#D9480F; --c-mente:#0C8599;
  --glyph-r:14px; --r:16px;
}
@media (prefers-color-scheme: dark){
  :root[data-skin="algodao"]:not([data-theme="light"]){
    --bg:#3B1430; --bg2:#2C0F2A; --surface:#4E1E40; --ink:#FFE6F2; --muted:#E6B0CB; --line:#7A3A63; --soft:#5C2548; --on-c:#3B1430;
    --c-letras:#FF8FC3; --c-leitura:#E3A6F2; --c-contas:#FF9AA5; --c-puzzle:#FF86B4; --c-ingles:#FFB3D1; --c-mente:#FF9EC4;
  }
  :root[data-skin="aventura"]:not([data-theme="light"]){
    --bg:#0E1B3D; --bg2:#0B2B3B; --surface:#17285A; --ink:#EAF2FF; --muted:#A6B8E0; --line:#2C4380; --soft:#1F3270; --on-c:#0E1B3D;
    --c-letras:#74A8FF; --c-leitura:#B197FF; --c-contas:#FF8787; --c-puzzle:#69DB7C; --c-ingles:#FFA94D; --c-mente:#3BC9DB;
  }
}
:root[data-skin="algodao"][data-theme="dark"]{
  --bg:#3B1430; --bg2:#2C0F2A; --surface:#4E1E40; --ink:#FFE6F2; --muted:#E6B0CB; --line:#7A3A63; --soft:#5C2548; --on-c:#3B1430;
  --c-letras:#FF8FC3; --c-leitura:#E3A6F2; --c-contas:#FF9AA5; --c-puzzle:#FF86B4; --c-ingles:#FFB3D1; --c-mente:#FF9EC4;
}
:root[data-skin="aventura"][data-theme="dark"]{
  --bg:#0E1B3D; --bg2:#0B2B3B; --surface:#17285A; --ink:#EAF2FF; --muted:#A6B8E0; --line:#2C4380; --soft:#1F3270; --on-c:#0E1B3D;
  --c-letras:#74A8FF; --c-leitura:#B197FF; --c-contas:#FF8787; --c-puzzle:#69DB7C; --c-ingles:#FFA94D; --c-mente:#3BC9DB;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:600 18px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 56px;
  min-height:100vh;
  background-image:var(--bg-img,none);background-attachment:fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--c,var(--c-letras));outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
#app{max-width:980px;margin:0 auto}
.w{text-transform:none}
body.upper .w{text-transform:uppercase}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font:800 22px var(--f-display);color:var(--ink)}
.brand svg{width:28px;height:28px}
.tools{display:flex;align-items:center;gap:8px}
.starpill{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 8px;font:800 20px var(--f-display)}
.starpill svg{width:26px;height:26px}
.starpill.bump{animation:bump .5s ease}
.iconbtn{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800;min-height:46px}
.btn{border:3px solid var(--line);border-bottom-width:6px;background:var(--surface);border-radius:18px;padding:12px 22px;font:700 20px var(--f-display);min-height:56px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--c,var(--c-letras));color:var(--on-c);border-color:var(--c,var(--c-letras));border-bottom-color:color-mix(in srgb,var(--c,var(--c-letras)) 60%,#000)}
.btn:active,.opt:active,.tile:active,.act:active{transform:translateY(3px)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.back{border:0;background:none;font:700 20px var(--f-display);color:var(--muted);padding:8px 4px;min-height:44px}

/* home */
.hero{padding-block:8px 18px}
.hero h1{font-size:clamp(30px,6.4vw,50px);font-weight:800;max-width:16ch}
.hero p{color:var(--muted);margin-top:8px;font-size:19px}
.mission{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.mission b{font:800 18px var(--f-display);margin-right:4px}
.mchip{font-size:15px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--muted)}
.mchip.done{background:var(--ok-bg);color:var(--good)}
.mchip.done::before{content:"✓ "}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.tile,.act{appearance:none;text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom:7px solid var(--c);border-radius:var(--r,24px);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 16px;align-items:center;min-height:112px}
.glyph{grid-row:span 3;width:80px;height:80px;border-radius:var(--glyph-r,22px);background:var(--c);color:var(--on-c);display:grid;place-items:center;font:800 34px var(--f-display);letter-spacing:-.02em}
.glyph svg{width:44px;height:44px}
.glyph.sm{width:64px;height:64px;font-size:26px;border-radius:var(--glyph-r,18px)}
.ttl{font:800 27px/1.1 var(--f-display)}
.dsc{color:var(--muted);font-size:16px;line-height:1.3}
.cnt{font-size:14px;font-weight:800;color:var(--c)}
.tile:hover,.act:hover{transform:translateY(-2px)}

/* menu */
.mtitle{font-size:clamp(30px,6vw,44px);font-weight:800;color:var(--c);margin-top:4px}
.msub{color:var(--muted);margin-top:8px;max-width:52ch}
.acts{display:grid;gap:14px;margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.act b{font:800 24px/1.1 var(--f-display)}
.act small{color:var(--muted);font-size:16px;font-weight:600;display:block;margin-top:2px}
.act .glyph{grid-row:span 1}
.act>span:last-child{display:block}

/* jogo */
.play{--c:var(--c-letras)}
.playbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--c)}
.dots i.now{background:var(--surface);box-shadow:0 0 0 4px var(--c)}
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:22px 18px;display:grid;justify-items:center;gap:14px;text-align:center}
.stem{display:grid;place-items:center;min-height:96px;gap:10px;max-width:100%}
.stemtext{font:700 clamp(24px,5vw,32px)/1.25 var(--f-display)}
.bigword{font:800 clamp(44px,12vw,76px)/1 var(--f-display);letter-spacing:.02em;overflow-wrap:anywhere}
.eq{font:800 clamp(44px,11vw,68px)/1 var(--f-display)}
.blank{display:inline-block;min-width:2.2em;border-bottom:5px solid var(--c);color:var(--c)}
.prompt{color:var(--muted);font-weight:700}
.emo{font-size:60px;line-height:1}
.emo.xl{font-size:92px}
.swatch{display:block;width:68px;height:68px;border-radius:50%;border:4px solid var(--line)}
.bignum{font:800 58px/1 var(--f-display)}
.bigspk{width:84px;height:84px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center}
.bigspk svg{width:44px;height:44px}
.listen{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:10px 20px;font:800 18px var(--f-display);display:inline-flex;gap:8px;align-items:center;min-height:50px}
.dots2{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center}
.dots2 .grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:260px}
.dots2 i{width:22px;height:22px;border-radius:50%;background:var(--c-puzzle);display:block}
.dots2 .g2 i{background:var(--c-ingles)}
.dots2 i.gone{background:transparent;border:3px dashed var(--muted);opacity:.7}
.dots2 .plus{font:800 34px var(--f-display);color:var(--muted)}
.opts{display:grid;gap:14px;margin-top:16px}
.opts.c1{grid-template-columns:1fr}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;border-radius:22px;min-height:92px;padding:10px;display:grid;place-items:center;font:700 30px var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.opt .num{font:800 44px var(--f-display)}
.opt .otext{font:700 26px/1.2 var(--f-display)}
.opt.right{background:var(--ok-bg);border-color:var(--good);animation:pop .4s ease}
.opt.wrong{background:var(--no-bg);border-color:var(--bad);animation:shake .4s ease}
.opt:disabled:not(.right){opacity:.55}
.fb{min-height:32px;margin-top:14px;text-align:center;font:800 22px var(--f-display)}
.fb.good{color:var(--good)}
.fb.try{color:var(--bad)}

/* letras */
.letterdetail{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px;margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;justify-content:center}
.ldbig{font:800 clamp(80px,22vw,120px)/1 var(--f-display);color:var(--c-letras);display:flex;align-items:baseline;gap:6px}
.ldbig small{font-size:.62em;opacity:.8}
.ldtext{font:700 28px var(--f-display)}
.ldtext b{color:var(--c-letras)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;margin-top:16px}
.lbtn{height:66px;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;background:var(--surface);font:800 28px var(--f-display);color:var(--ink);padding:0}
.lbtn small{font-size:18px;opacity:.7;margin-left:2px}
.lbtn.on{background:var(--c-letras);border-color:var(--c-letras);color:var(--on-c)}
.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.slot{min-width:86px;height:74px;padding:0 10px;border:4px dashed var(--line);border-radius:18px;display:grid;place-items:center;font:800 36px var(--f-display)}
.slot.on{border-style:solid;border-color:var(--c);background:var(--soft)}
.sylrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:18px}
.syl{min-width:92px;min-height:76px;padding:6px 16px;border:3px solid var(--line);border-bottom-width:7px;border-radius:20px;background:var(--surface);font:800 34px var(--f-display);color:var(--ink)}
.syl.used{opacity:.3}
.syl.wrong{animation:shake .4s ease;border-color:var(--bad);background:var(--no-bg)}

/* histórias */
.story{margin-top:16px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:12px}
.sent{display:block;width:100%;text-align:left;border:0;background:none;border-radius:16px;padding:12px 14px;font:700 clamp(22px,4.6vw,28px)/1.35 var(--f-body);color:var(--ink)}
.sent.on{background:var(--soft);box-shadow:inset 6px 0 0 var(--c-leitura)}

/* quebra-cabeça */
.pz{display:grid;grid-template-columns:minmax(0,480px) 170px;gap:18px;justify-content:center;align-items:start;margin-top:14px}
.board{display:grid;gap:3px;aspect-ratio:1;width:100%;padding:6px;background:var(--line);border-radius:20px;transition:padding .3s,gap .3s}
.board.solved{gap:0;padding:0;overflow:hidden}
.ptile{min-width:0;min-height:0;border:0;padding:0;border-radius:8px;background-repeat:no-repeat;background-color:var(--soft)}
.board.solved .ptile{border-radius:0}
.ptile.fit{box-shadow:inset 0 0 0 4px var(--good)}
.ptile.sel{outline:5px solid var(--c-puzzle);outline-offset:-5px;filter:brightness(1.08)}
.board.solved .ptile{box-shadow:none}
.thumb{width:100%;aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background-size:cover}
.pzside{display:grid;gap:8px;justify-items:center}
.mv{font:800 20px var(--f-display);color:var(--muted)}
.endcard{margin-top:18px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px;text-align:center}
.endcard b{font:800 28px var(--f-display);color:var(--good)}
.endcard .row{justify-content:center}

/* inglês */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}
.ecard{background:var(--surface);border:2px solid var(--line);border-bottom-width:6px;border-radius:22px;padding:14px 10px;display:grid;justify-items:center;gap:2px;min-height:158px;align-content:center}
.ecard b{font:800 22px var(--f-display);margin-top:6px;overflow-wrap:anywhere}
.ecard small{color:var(--muted);font-weight:700;font-size:16px}
.ecard.on{border-color:var(--c-ingles);background:var(--soft)}

/* resultado */
.result{text-align:center;display:grid;justify-items:center;gap:12px;padding-top:24px}
.medal svg{width:128px;height:128px;animation:pop .6s ease}
.result h2{font-size:clamp(28px,6vw,40px);max-width:18ch}
.score{font:700 22px var(--f-display);color:var(--muted)}
.score b{color:var(--c);font-size:1.4em}
.result .row{justify-content:center}

/* pais */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;margin-top:16px;display:grid;gap:10px}
.panel h3{font-size:22px;font-weight:800}
.panel p{color:var(--muted);font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 16px;font-weight:800;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--c-letras);border-color:var(--c-letras);color:var(--on-c)}
input[type=range]{width:100%;accent-color:var(--c-letras);height:36px}
.warn{color:var(--bad)!important;font-weight:800}

.mascots{display:block;font-size:46px;letter-spacing:10px;margin-top:6px}
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px;margin-top:8px}
.skincard{border:0;border-bottom:8px solid rgba(0,0,0,.2);border-radius:28px;padding:22px;text-align:left;display:grid;gap:6px;min-height:200px;align-content:end}
.skincard .sk-emo{font-size:56px;line-height:1;letter-spacing:6px}
.skincard b{font:800 32px var(--f-display)}
.skincard small{font-size:17px;font-weight:700;opacity:.9}
.inp{width:100%;font:700 18px var(--f-body);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:52px}
textarea.inp{resize:vertical;line-height:1.4}
.fl{font:800 17px var(--f-display);margin-top:6px}
.hint{color:var(--muted);font-size:16px}
.plist{margin:0;padding-left:22px;color:var(--muted);font-size:17px}
.plist li{margin:5px 0}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;font-weight:700;padding:6px 0}
.chk input{width:26px;height:26px;margin-top:1px;accent-color:var(--c-letras);flex:none}
.chk small{display:block;color:var(--muted);font-weight:600;font-size:15px}
.pcard{appearance:none;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom:8px solid var(--pc,var(--c-letras));border-radius:26px;padding:18px;display:grid;justify-items:center;gap:4px;min-height:170px;align-content:center}
.pcard .pav{font:800 52px/1 var(--f-display)}
.pcard b{font:800 26px var(--f-display);overflow-wrap:anywhere;text-align:center}
.pcard small{color:var(--muted);font-weight:700}
.pcard.add{border-style:dashed;background:transparent}
.skincard[aria-pressed="true"]{outline:5px solid var(--ink);outline-offset:3px}
.opt.picked{border-color:var(--c);background:var(--soft)}
.opt.picked:disabled{opacity:1}
.rowline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
body.big #app{zoom:1.18}
body.legible{--f-display:'Atkinson Hyperlegible','Trebuchet MS',system-ui,sans-serif;--f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}

/* folha do relatório: sempre em papel claro, no claro e no escuro */
.sheet{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper-line);border-radius:18px;padding:22px 20px;margin-top:14px;font:600 15px/1.5 var(--f-body)}
.sheet h2{font:800 24px/1.15 var(--f-display);margin:0 0 2px}
.sheet h3{font:800 17px var(--f-display);margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--paper-line)}
.sheet p{margin:8px 0}
.sheet .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px;margin:14px 0}
.sheet .meta div{display:grid;min-width:0}
.sheet .meta span{color:var(--paper-mute);font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.sheet .tw{overflow-x:auto}
.sheet table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.sheet th,.sheet td{border-bottom:1px solid var(--paper-line);padding:7px 8px;text-align:left;vertical-align:top}
.sheet th{background:var(--paper-soft);font-weight:800}
.sheet .bar{height:12px;background:var(--paper-soft);border:1px solid var(--paper-line);border-radius:6px;overflow:hidden;min-width:90px;margin-bottom:2px}
.sheet .bar i{display:block;height:100%;background:var(--paper-bar)}
.sheet .bd{display:inline-block;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;font-size:12.5px;font-weight:800;white-space:nowrap}
.sheet .bd.aut{color:var(--paper-good)}.sheet .bd.des{color:var(--paper-mid)}.sheet .bd.apo{color:var(--paper-low)}.sheet .bd.insuf{color:var(--paper-mute)}
.sheet ul{margin:6px 0;padding-left:20px}
.sheet .fl2{display:block;margin-top:12px;font-weight:800;font-size:14px}
.sheet textarea,.sheet input.ln{width:100%;font:600 15px/1.4 var(--f-body);color:var(--paper-ink);background:var(--paper);border:1.5px solid var(--paper-line);border-radius:8px;padding:8px;margin-top:4px}
.sheet .pnote{display:none;white-space:pre-wrap;border:1px solid var(--paper-line);border-radius:6px;padding:8px;min-height:2.6em;margin-top:4px}
.sheet .sign{display:flex;gap:30px;margin-top:38px}
.sheet .sign div{flex:1;border-top:1.5px solid var(--paper-ink);padding-top:4px;font-size:13px;color:var(--paper-mute)}
.sheet .foot{font-size:12.5px;color:var(--paper-mute)}
@media print{
  @page{size:A4;margin:13mm}
  :root{padding:0!important}
  body{background:#fff!important;background-image:none!important;padding:0!important;min-height:0}
  body::before,.top,.noprint{display:none!important}
  body.big #app{zoom:1}
  .sheet{border:0;border-radius:0;padding:0;margin:0;font-size:11pt}
  .sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet .tw{overflow:visible}
  .sheet table{min-width:0}
  .sheet textarea,.sheet input.ln{display:none}
  .sheet .pnote{display:block}
  .sheet h3,.sheet tr,.sheet .keep{break-inside:avoid}
}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (max-width:640px){
  .pz{grid-template-columns:minmax(0,1fr)}
  .pzside{grid-template-columns:110px auto;justify-content:start;align-items:center}
  .emo{font-size:52px}
  .opt{min-height:84px;font-size:26px}
  .opt .num{font-size:40px}
  .brand{font-size:19px}
}
/* visual v2: mais infantil e moderno */
:root{--mas-body:#5C8DF0;--mas-belly:#DCE8FF;--mas-wing:#3F6FD6;--mas-beak:#FFB020;--shadow:0 10px 22px -12px color-mix(in srgb,var(--ink) 50%,transparent)}
:root[data-skin="algodao"]{--mas-body:#FF8FC3;--mas-belly:#FFE3F0;--mas-wing:#E8589F}
body{
  background-image:
    radial-gradient(circle at 18px 22px,color-mix(in srgb,var(--c-contas) 16%,transparent) 5px,transparent 6px),
    radial-gradient(circle at 62px 58px,color-mix(in srgb,var(--c-letras) 14%,transparent) 8px,transparent 9px),
    radial-gradient(circle at 96px 20px,color-mix(in srgb,var(--c-puzzle) 14%,transparent) 4px,transparent 5px),
    var(--bg-img,none);
  background-size:110px 90px,110px 90px,110px 90px,auto;
  background-attachment:fixed;
}
.mascot{display:block;height:auto}
.mascot .mb{fill:var(--mas-body)}.mascot .mbl{fill:var(--mas-belly)}.mascot .mw{fill:var(--mas-wing)}.mascot .mk{fill:var(--mas-beak)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* cabeçalho */
.top{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:0 0 24px 24px}
.brand{gap:8px;font:700 22px var(--f-display)}
.brand .mascot{width:40px}
.brand b{color:var(--c-letras);font-weight:700}
.starpill{border-width:3px;box-shadow:var(--shadow)}
.iconbtn,.chip{border-width:3px;box-shadow:var(--shadow)}

/* botões */
.btn{border-radius:999px;padding:12px 26px;border-width:3px;border-bottom-width:7px;box-shadow:0 8px 14px -10px color-mix(in srgb,var(--ink) 60%,transparent)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--c-letras)) 78%,#fff),var(--c,var(--c-letras)))}

/* início */
.hero2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:center;padding-block:6px 16px}
.heroimg{display:block;width:clamp(110px,32vw,170px);height:auto;border-radius:28px;box-shadow:0 8px 18px rgba(0,0,0,.18);animation:bob 3.2s ease-in-out infinite}
.hero2 .mascot{width:clamp(92px,26vw,140px);animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(0,0,0,.14))}
.bubble{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:30px;padding:14px 18px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-12px;top:34px;width:20px;height:20px;background:var(--surface);border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:rotate(45deg)}
.bubble h1{font-size:clamp(26px,6vw,40px);font-weight:700;max-width:none}
.bubble p{color:var(--muted);margin-top:4px;font-size:18px}
.xp{display:grid;gap:10px;background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.xp .rx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;font:700 19px var(--f-display)}
.xp .rx small{font:700 15px var(--f-body);color:var(--muted)}
.xpbar{height:16px;border-radius:999px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--star),#FF9F1C);min-width:16px}
.badges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.badge{display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);text-align:center;min-width:0;overflow-wrap:anywhere}
.badge span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--soft);border:3px dashed var(--line)}
.badge.done{color:var(--ink)}
.badge.done span{background:var(--c);border:3px solid var(--c);color:var(--on-c);font-weight:800}
.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:14px}
.tile{position:relative;overflow:hidden;grid-template-columns:1fr;justify-items:start;align-content:start;gap:6px;min-height:190px;padding:16px;border:0;border-bottom:8px solid color-mix(in srgb,var(--c) 68%,#000);border-radius:30px;color:var(--on-c);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));box-shadow:var(--shadow)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.2);pointer-events:none}
.tile .glyph{grid-row:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.28);color:inherit;font-size:30px;position:relative;z-index:1}
.tile .glyph svg{width:36px;height:36px}
.tile .ttl{font-size:24px;line-height:1.05;position:relative;z-index:1}
.tile .dsc{color:inherit;opacity:.92;font-size:15px;position:relative;z-index:1}
.tile .cnt{color:inherit;background:rgba(255,255,255,.26);border-radius:999px;padding:3px 12px;font-size:13px;margin-top:auto;position:relative;z-index:1}

/* menus */
.mtitle{display:inline-block;background:var(--c);color:var(--on-c);padding:6px 20px;border-radius:26px;font-size:clamp(26px,5.4vw,38px);font-weight:700;box-shadow:var(--shadow)}
.act{border-radius:30px;box-shadow:var(--shadow)}
.act .glyph{border-radius:50%}

/* jogos */
.qcard{position:relative;overflow:hidden;border:3px solid var(--line);border-radius:34px;box-shadow:var(--shadow)}
.qcard::before,.qcard::after{content:"";position:absolute;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,transparent);pointer-events:none}
.qcard::before{width:130px;height:130px;left:-44px;top:-44px}
.qcard::after{width:96px;height:96px;right:-30px;bottom:-30px}
.qcard>*{position:relative;z-index:1}
.opt{border-radius:28px;box-shadow:0 8px 14px -12px color-mix(in srgb,var(--ink) 60%,transparent)}
.opt.right{box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 28%,transparent)}
.dots{gap:6px;align-items:center}
.dots i{width:24px;height:24px;border-radius:0;background:var(--line);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:none}
.dots i.done{background:var(--star)}
.dots i.now{background:var(--c);box-shadow:none;animation:bob 1.2s ease-in-out infinite}
.fb{font-size:24px}

/* resultado e confete */
.medal .mascot{width:150px;height:auto;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(0,0,0,.15))}
.confetti{position:fixed;left:50%;top:38%;width:0;height:0;pointer-events:none;z-index:50}
.confetti i{position:absolute;width:10px;height:14px;border-radius:3px;animation:burst 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.pcard{border-radius:32px;box-shadow:var(--shadow)}
@media (max-width:640px){
  .hero2 .mascot{width:96px}
  .bubble{padding:12px 14px}
}
/* v3: conforto sensorial, pausa, rotina, fichas, apoio */
body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation:none!important;transition:none!important}
body.no-masc .mascot{display:none}
body.no-masc .hero2{grid-template-columns:minmax(0,1fr)}
body.no-masc .hero2>div:first-child{display:none}
body.no-masc .bubble::before{display:none}
body.no-masc .medal{display:none}
body.no-dots{background-image:var(--bg-img,none)}
body.no-anim .confetti{display:none}
.panel>summary,details.panel>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";font:700 28px var(--f-display);color:var(--muted)}
details.panel[open]>summary::after{content:"–"}
details.panel>summary h3{margin:0}
details.panel>:not(summary){margin-top:0}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.goal small{display:block;color:var(--muted);font-weight:700;font-size:15px}
.goal .gst{width:auto;min-height:44px;font-size:16px}
@media (max-width:640px){.goal{grid-template-columns:1fr}}
.cntleft{font:700 16px var(--f-display);color:var(--muted)}
.tokbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.tk{font-size:28px;line-height:1;filter:grayscale(1);opacity:.3}
.tk.on{filter:none;opacity:1;animation:pop .4s ease}
.steps{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.step{flex:0 0 112px;scroll-snap-align:start;display:grid;justify-items:center;gap:2px;padding:10px 6px;border-radius:22px;border:3px dashed var(--line);background:var(--bg);color:var(--ink)}
.step .si{font:700 32px/1.25 var(--f-display)}
.step b{font:700 16px var(--f-display);text-align:center}
.step small{font-weight:800;color:var(--muted);min-height:1.3em;font-size:14px}
.step.now{border:3px solid var(--c-letras);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-letras) 22%,transparent)}
.step.now small{color:var(--c-letras)}
.step.done{opacity:.65}
.step.done .si{color:var(--good)}
.sup{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-weight:800;font-size:15px}
.supchip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;min-height:40px;color:var(--ink)}
.supchip.on{background:var(--c-letras);border-color:var(--c-letras);color:var(--on-c)}
.ovl{position:fixed;inset:0;z-index:60;display:grid;place-content:center;justify-items:center;gap:16px;padding:24px;padding-top:max(24px,env(safe-area-inset-top,0px));text-align:center;background:var(--bg);color:var(--ink);overflow-y:auto}
.ovl h2{font-size:clamp(32px,8vw,52px)}
.ovl p{color:var(--muted);font-size:20px;max-width:28ch;margin:0}
.ovl .bigtxt{font:700 28px/1.2 var(--f-display);color:var(--ink)}
.pcircle{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c-puzzle) 55%,#fff),var(--c-puzzle));animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.8)}50%{transform:scale(1.1)}}
.pbar{width:min(80vw,320px);height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--c-puzzle);transition:width 1s linear}
.rwd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-size:44px}
.emo.sm{font-size:24px;line-height:1}
.dots2 .grp{max-width:150px;gap:2px}
.emo.sm.gone{opacity:.28;filter:grayscale(1)}
.dots2 .grp .emo.sm{display:inline-block}
@media print{.ovl,.confetti{display:none!important}}
/* ===== tema Mundo Sabido ===== */
:root[data-skin="mundo"]{
  --bg:#CFE8FF; --bg2:#EEF5FF; --surface:#FFFFFF; --ink:#14246B; --muted:#5A6BA3; --line:#D2E2F8; --soft:#E3EEFF;
  --bg-img:linear-gradient(180deg,#8FCBFF 0,#BFE2FF 260px,#E4F1FF 520px,#F1EEFF 100%);
  --c-letras:#2F78E6; --c-leitura:#12998A; --c-contas:#3E9A22; --c-puzzle:#9446C9; --c-ingles:#E06F0B; --c-mente:#8F5BD6;
  --glyph-r:50%; --r:26px; --good:#2B9348; --ok-bg:#D8F6DD; --no-bg:#FFE0EC; --shadow:0 8px 18px -10px rgba(40,70,160,.45);
  color-scheme:light;
}
:root[data-skin="mundo"]{background:#E4F1FF}
:root[data-skin="mundo"] body{background-image:var(--bg-img);background-attachment:scroll;background-repeat:no-repeat;background-size:100% 100%}
body.mundo::before{background:#8FCBFF}
body.hasnav{padding-bottom:104px}
.top .logo{height:44px;width:auto;display:block}
body.mundo .top{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0}
.mhero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:6px 10px;align-items:end;margin-bottom:6px}
.mcap img{display:block;width:100%;max-width:260px;height:auto;filter:drop-shadow(0 8px 8px rgba(30,60,140,.25));animation:bob 3.4s ease-in-out infinite}
.mside{display:grid;gap:10px;align-content:center}
.mside .bubble{border-radius:26px;padding:10px 14px}.mside .bubble h1{font-size:clamp(20px,6vw,30px)}.mside .xp{margin:0}
.mside .bubble::before{left:-10px;top:50%}
body.mundo .xp{border-width:0;box-shadow:var(--shadow)}
.pillc{background:var(--soft);border-radius:999px;padding:2px 14px;color:var(--c-letras)}
.mtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 12px}
.mtile{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:5px;min-height:74px;padding:8px 8px;border:0;border-radius:22px;background:var(--bg-t);color:var(--tc);text-align:left;box-shadow:0 6px 0 rgba(20,36,107,.18),var(--shadow);overflow:hidden}
.mtile::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);pointer-events:none}
.mtile img{width:48px;height:44px;object-fit:contain;position:relative}
.mtile .mt{font:700 14px/1.15 var(--f-display);position:relative;overflow-wrap:break-word;hyphens:auto}
.mtile .chev{position:relative;width:22px;height:22px;border-radius:50%;background:#fff;color:#2F78E6;display:grid;place-items:center;font:800 18px/1 var(--f-display);font-style:normal}
.mtile:active{transform:translateY(3px)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 18px -8px rgba(40,70,160,.35);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto}
.bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 2px;color:var(--muted);font:700 12px var(--f-display);min-height:52px;position:relative}
.bnav button[aria-current="page"]{color:var(--c-letras)}
.bnav button[aria-current="page"]::after{content:"";position:absolute;bottom:-2px;width:46px;height:4px;border-radius:4px;background:var(--c-letras)}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center;font:700 15px var(--f-display)}
.pbar2{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.pbar2 i{display:block;height:100%;background:var(--c);border-radius:99px}
.sech{font-size:20px;margin:14px 0 8px}
.trophies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trophy{display:grid;justify-items:center;gap:2px;text-align:center;background:var(--surface);border-radius:20px;padding:12px 8px;box-shadow:var(--shadow);opacity:.6}
.trophy.on{opacity:1}.trophy span{font-size:36px}.trophy b{font:700 16px var(--f-display)}.trophy small{color:var(--muted);font-size:13px}
@media (min-width:641px){.mtiles{grid-template-columns:repeat(3,1fr)}.mtile{min-height:96px}.mtile img{width:72px;height:64px}.mtile .mt{font-size:20px}.trophies{grid-template-columns:repeat(3,1fr)}}
@media (max-width:380px){.bnav button{font-size:11px}.mtile img{width:40px}.mtile .mt{font-size:13px}.mtile .chev{display:none}}

function tone(f,t0,d,type,g){
  if(!S.sound||!S.fx)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime+t0;
    o.type=type||'sine';o.frequency.value=f;
    v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime((g||0.12)*S.vol,t+0.02);v.gain.exponentialRampToValueAtTime(0.0001,t+d);

  }catch(e){}
}

const hasTTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);

if(hasTTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}}
function voiceFor(lang){
  const l=lang.toLowerCase();
  const norm=v=>v.lang.toLowerCase().replace('_','-');
  const exact=voices.filter(v=>norm(v)===l);
  const pre=voices.filter(v=>norm(v).indexOf(l.slice(0,2))===0);
  const pool=exact.length?exact:pre;
  return pool.find(v=>/google|natural|enhanced|premium|luciana|joana|francisca|samantha/i.test(v.name))||pool[0]||null;
}
let token=0;
function stopSpeech(){token++;if(hasTTS){try{speechSynthesis.cancel();}catch(e){}}}
function say(parts,done,onpart){
  if(!hasTTS||!S.sound||PAUSED){if(done)done();return;}
  if(!Array.isArray(parts))parts=[parts];
  stopSpeech();
  const my=token;let i=0;
  const next=()=>{
    if(my!==token)return;
    if(i>=parts.length){if(done)done();return;}
    const idx=i++;const p=parts[idx];
    if(onpart)onpart(idx);
    const u=new SpeechSynthesisUtterance(p.t);
    u.lang=p.lang||'pt-BR';
    const v=voiceFor(u.lang);if(v)u.voice=v;
    u.rate=p.rate||S.rate;u.pitch=1.08;u.volume=S.vol;
    let fin=false,tm=null;
    const go=()=>{if(fin)return;fin=true;clearTimeout(tm);setTimeout(next,140);};
    u.onend=go;u.onerror=go;
    tm=setTimeout(go,Math.max(1800,p.t.length*150/S.rate+900));
    try{speechSynthesis.speak(u);}catch(e){go();}
  };
  setTimeout(next,70);
}

const hasInt=()=>!!(S.interest&&INT_EMOJI[S.interest]&&!FIXED);
const tokenEmoji=()=>TOKEN_EMOJI[S.interest]||'⭐';
function allWords(){return WORDS.concat(hasInt()?INT_WORDS[S.interest].map(x=>({w:x[0],e:x[1]})):[]);}
function pickWords(n){
  if(!hasInt())return pick(WORDS,n);
  const iw=INT_WORDS[S.interest].map(x=>({w:x[0],e:x[1]})),a=pick(iw,Math.min(3,iw.length));
  return shuffle(a.concat(pick(WORDS.filter(x=>!a.some(y=>y.e===x.e)),n-a.length)));
}

let PAUSED=false,PAUSED_MS=0;
function overlay(html,cls){
  const d=document.createElement('div');d.className='ovl '+(cls||'');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  d.innerHTML=html;document.body.appendChild(d);return d;
}
function startPause(onEnd){
  if(PAUSED)return;
  PAUSED=true;stopSpeech();
  const t0=Date.now(),secs=S.pauseSec|0;
  const d=overlay(`<div class="pcircle" aria-hidden="true"></div><h2>Pausa</h2><p>Respire com calma. Volte quando quiser.</p>
    ${secs?'<div class="pbar" aria-hidden="true"><i id="pfill"></i></div><p id="pleft"></p>':''}
    <button class="btn primary" id="pback" style="--c:var(--c-puzzle)">Voltar às atividades</button>`,'pause');
  let iv=null;
  if(secs){
    const upd=()=>{const el=Math.floor((Date.now()-t0)/1000),f=d.querySelector('#pfill'),l=d.querySelector('#pleft');
      if(f)f.style.width=Math.min(100,100*el/secs)+'%';
      if(l)l.textContent=el>=secs?'Quando estiver pronto, toque no botão.':'';};
    upd();iv=setInterval(upd,1000);
  }
  d.querySelector('#pback').onclick=()=>{
    if(iv)clearInterval(iv);
    d.remove();PAUSED=false;
    const ms=Date.now()-t0;PAUSED_MS+=ms;
    logEntry({mod:'pausa',act:'pausa',dom:'',lab:'Pausa',ans:'',ms:ms},SESS&&view.name==='avalrun'?SESS.id:null);
    if(onEnd)onEnd();
  };
  d.querySelector('#pback').focus();
}
function startBreak(onEnd){
  const d=overlay('<span class="emo xl" aria-hidden="true">🎈</span><h2>Hora de brincar!</h2><p>Quando terminar, toque no botão.</p><button class="btn primary" id="bkOk" style="--c:var(--c-ingles)">Terminei</button>','pause');
  d.querySelector('#bkOk').onclick=()=>{d.remove();if(onEnd)onEnd();};
  d.querySelector('#bkOk').focus();
}
const tokenOn=()=>!!P&&S.reinf==='tokens';
function tokenAdd(){if(!tokenOn())return false;P.tokens.n=(P.tokens.n||0)+1;save();return P.tokens.n>=S.goalTokens;}
function tokenBarHTML(){
  const g=S.goalTokens,n=Math.min(P.tokens.n||0,g),e=tokenEmoji();
  return '<div class="tokbar" role="img" aria-label="Fichas: '+n+' de '+g+'">'+Array.from({length:g},(_,i)=>'<span class="tk'+(i<n?' on':'')+'">'+e+'</span>').join('')+'</div>';
}
function refreshTokens(m){const el=$('.tokbar',m);if(el)el.outerHTML=tokenBarHTML();}
function showReward(){
  if(PAUSED)return;
  PAUSED=true;stopSpeech();sfx.win();
  const t0=Date.now(),e=tokenEmoji();
  const d=overlay('<div class="rwd" aria-hidden="true">'+Array.from({length:S.goalTokens},()=>'<span>'+e+'</span>').join('')+'</div><h2>Quadro completo!</h2><p class="bigtxt">'+esc(S.reward||'Hora de brincar!')+'</p><button class="btn primary" id="rwOk" style="--c:var(--c-contas)">Combinado!</button>','reward');
  d.querySelector('#rwOk').onclick=()=>{d.remove();PAUSED=false;PAUSED_MS+=Date.now()-t0;P.tokens.n=0;save();if(view.name==='home')screens.home($('#main'));};
  d.querySelector('#rwOk').focus();
}

function mathQs(level){
  const out=[],seen=new Set();let guard=0;
  const NAMES=S.skin==='algodao'?['Ana','Lia','Bia','Duda','Malu','Alice']:S.skin==='mundo'?['Ana','Pedro','Lia','Davi','Bia','Caio']:['Pedro','Davi','Caio','Théo','Enzo','Lucas'];
  const ITEMS=hasInt()?INT_ITEMS[S.interest]:[{w:'balas',g:'as'},{w:'figurinhas',g:'as'},{w:'carrinhos',g:'os'},{w:'livros',g:'os'},{w:'biscoitos',g:'os'},{w:'bolinhas',g:'as'}];
  while(out.length<8&&guard++<400){
    let a,b,op,ans,key,q;
    if(level===1){
      op=rand(2)?'+':'−';
      if(op==='+'){a=rand(9)+1;b=rand(10-a)+1;ans=a+b;}else{a=rand(9)+2;b=rand(a-1)+1;ans=a-b;}
    }else if(level===2){
      op=rand(2)?'+':'−';
      if(op==='+'){a=rand(15)+3;b=rand(20-a-1)+2;ans=a+b;}else{a=rand(10)+11;b=rand(a-2)+2;ans=a-b;}
    }else if(level===3){
      op='×';a=[2,3,4,5,10][rand(5)];b=rand(10)+1;ans=a*b;
    }else{
      op=rand(2)?'+':'−';
      if(op==='+'){a=rand(12)+3;b=rand(20-a-1)+2;ans=a+b;}else{a=rand(10)+11;b=rand(a-2)+2;ans=a-b;}
    }
    key=a+op+b;if(seen.has(key))continue;seen.add(key);
    if(level===4){
      const nm=NAMES[rand(NAMES.length)],it=ITEMS[rand(ITEMS.length)];
      const text=op==='+'?`${nm} tem ${a} ${it.w}. Ganhou mais ${b}. Quant${it.g} ${it.w} ${nm} tem agora?`:`${nm} tinha ${a} ${it.w}. Deu ${b} para um amigo. Quant${it.g} ${it.w} sobraram?`;
      q={stem:`<span class="stemtext">${esc(text)}</span>`,prompt:'Pense com calma e escolha a resposta.',say:[{t:text}],opts:numOpts(ans),cols:2};
    }else{
      const word=op==='+'?'mais':op==='−'?'menos':'vezes';
      let vis='';
      if(level===1){
        vis=op==='+'?`<div class="dots2"><span class="grp">${objs(a)}</span><span class="plus">+</span><span class="grp g2">${objs(b)}</span></div>`
                    :`<div class="dots2"><span class="grp">${objs(a-b)}${gone(b)}</span></div>`;
      }
      q={stem:`${vis}<span class="eq">${a} ${op} ${b} = ?</span>`,prompt:level===1&&op==='−'?'As bolinhas tracejadas foram tiradas.':'Quanto é?',
         say:[{t:`Quanto é ${a} ${word} ${b}?`}],opts:numOpts(ans,op==='×'?[ans+a,ans-a,ans+b]:[]),cols:2};
    }
    q.dom='calc';q.lvl=level;q.lab=(level===4?'Problema ':'')+a+' '+op+' '+b;q.ans=ans;
    q.after=[{t:`${ans}`}];
    out.push(q);
  }
  return out;
}

function qInglesRaw(poolIn){

      opts:four.map(x=>({h:`<span class="otext">${esc(x.en)}</span>`,ok:x===it})),cols:2,after};

}
function backTo(name,arg){
  if(HOK&&hpos>0&&sameView(hist[hpos-1],{name:name,arg:arg}))history.back();
  else go(name,arg,{replace:true});
}
window.addEventListener('popstate',e=>{
  const i=e.state&&typeof e.state.i==='number'?e.state.i:0;
  stopSpeech();
  const ent=hist[i]||{name:P?'home':'who'};
  hist[i]=ent;hpos=i;
  view={name:ent.name,arg:ent.arg};
  render();try{window.scrollTo(0,0);}catch(x){}
});

});

 ['puzzle','Mundo dos Quebra-Cabeças','puz','linear-gradient(160deg,#C98AEB,#A45BD4)','#fff'],['ingles','Mundo do Inglês','flag','linear-gradient(160deg,#FFC37E,#FF9A3C)','#5A2A00'],
 ['leitura','Mundo da Leitura','book','linear-gradient(160deg,#6BE8D0,#2CC5AA)','#0B3B45'],['mente','Mundo da Descoberta','bulb','linear-gradient(160deg,#E7B6FB,#C98AEB)','#3A1B66']];
function homeMundo(m,d,done,ri){
  m.innerHTML=`<section class="mhero"><div class="mcap">${S.masc?`<img src="${MIMG.capy}" alt="Capi, a capivara do Mundo Sabido">`:''}</div>
  <div class="mside"><div class="bubble"><h1>Olá, ${esc(P?P.name.split(' ')[0]:'')}!</h1><p>O que vamos aprender hoje?</p></div>${progressHTML(ri)}</div></section>
  ${routineHTML()}
  <div class="xp"><div class="rx"><span>🎯 Minha Missão de Hoje</span><span class="pillc">${done}/${Object.keys(MNAME).length}</span></div>
  <div class="badges">${Object.keys(MNAME).map(k=>`<div class="badge${d[k]?' done':''}" style="--c:var(--c-${k})"><span>${d[k]?'✓':BADGE[k][0]}</span>${BADGE[k][1]}</div>`).join('')}</div></div>
  <div class="mtiles">${MT.map(t=>`<button class="mtile" style="--bg-t:${t[3]};--tc:${t[4]}" data-go="menu"${dataArg(t[0])}><img src="${MIMG[t[2]]}" alt="" aria-hidden="true"><span class="mt">${t[1]}</span><i class="chev" aria-hidden="true">›</i></button>`).join('')}</div>
  <div class="row"><button class="chip" data-act="skinpick">Trocar tema</button></div>`;
}
screens.progress=m=>{
  const ri=rankInfo(),d=S.day.d===today()?S.day.m:{},done=Object.keys(MNAME).filter(k=>d[k]).length;
  const tot=Object.keys(MODS).reduce((a,k)=>a+roundsOf(k),0),mx=Math.max(1,...Object.keys(MODS).map(k=>roundsOf(k)));
  m.innerHTML=`<h2 class="mtitle" style="--c:var(--c-letras)">Meu Progresso</h2>
  <div class="xp" style="margin-top:12px"><div class="rx"><span>⭐ ${S.stars} ${S.stars===1?'estrela':'estrelas'}</span><span>${esc(ri.name)}</span></div><div class="xpbar"><i style="width:${ri.pct}%"></i></div>
  <div class="rx"><small>${ri.next?'Faltam '+(ri.next[0]-S.stars)+' estrelas para '+esc(ri.next[1]):'Você chegou ao nível mais alto!'}</small></div></div>
  <div class="xp"><div class="rx"><span>Hoje</span><span>${done}/${Object.keys(MNAME).length} missões</span></div></div>
  <div class="xp"><div class="rx"><span>Rodadas por área</span><span>${tot} no total</span></div>
  ${Object.keys(MODS).map(k=>{const n=roundsOf(k);return `<div class="prow" style="--c:var(--c-${k})"><span>${esc(TILE[k])}</span><div class="pbar2" role="img" aria-label="${n} rodadas"><i style="width:${Math.round(100*n/mx)}%"></i></div><b>${n}</b></div>`;}).join('')}</div>`;
};
screens.achv=m=>{
  const trophies=RANKS.map(r=>{const ok=S.stars>=r[0];return `<div class="trophy${ok?' on':''}"><span aria-hidden="true">${ok?'🏆':'🔒'}</span><b>${esc(r[1])}</b><small>${r[0]} estrelas</small></div>`;}).join('');
  const meds=Object.keys(MODS).map(k=>{const n=roundsOf(k),lv=n>=10?3:n>=5?2:n>=1?1:0;return `<div class="trophy${lv?' on':''}" style="--c:var(--c-${k})"><span aria-hidden="true">${['🔒','🥉','🥈','🥇'][lv]}</span><b>${esc(TILE[k])}</b><small>${lv===3?'Ouro!':lv===2?'Prata · 10 rodadas = ouro':lv===1?'Bronze · 5 rodadas = prata':'1 rodada = bronze'}</small></div>`;}).join('');
  m.innerHTML=`<h2 class="mtitle" style="--c:var(--c-puzzle)">Conquistas</h2><h3 class="sech">Níveis</h3><div class="trophies">${trophies}</div><h3 class="sech">Medalhas</h3><div class="trophies">${meds}</div>`;
};
screens.menu=(m,k)=>{
  const M=MODS[k];if(!M)return go('home');
  m.innerHTML=`${backBtn('home')}<h2 class="mtitle" style="--c:var(--c-${k})">${M.title}</h2><p class="msub">${esc(M.sub)}</p>
  <div class="acts" style="--c:var(--c-${k})">${M.acts.map(a=>`<button class="act" data-go="act"${dataArg({m:k,id:a.id})}><span class="glyph sm">${a.g}</span><span><b>${esc(a.t)}</b><small>${esc(a.d)}</small></span></button>`).join('')}</div>`;
};
screens.act=(m,arg)=>{const f=arg&&ACTS[arg.m+':'+arg.id];if(f)f(m,arg);else go('home');};

/* --- resultado --- */
function result(m,o){
  S.rounds[o.key]=(S.rounds[o.key]||0)+1;markToday(o.module);save();
  sfx.win();if(S.reinf==='stars')confetti();
  const r=o.earned/o.total;
  const msg=r===1?'Perfeito! Tudo certo de primeira!':r>=0.6?'Muito bem! Continue assim!':'Boa tentativa! Vamos jogar de novo?';
  m.innerHTML=`<section class="result" style="--c:var(--c-${o.module})"><div class="medal">${mascot('cheer')}</div><h2>${msg}</h2>
  <p class="score"><b>${o.earned}</b> de ${o.total} de primeira</p>
  <div class="row"><button class="btn primary" id="again">Jogar de novo</button><button class="btn" id="menuBtn">Voltar ao menu</button></div></section>`;
  $('#again',m).onclick=()=>{sfx.tap();o.again();};
  $('#menuBtn',m).onclick=()=>{sfx.tap();backTo.apply(null,o.back);};
  say({t:msg});
}

const ATT=[['🐶','🐱'],['🍎','🍅'],['⭐','🌟'],['🔴','🟠'],['🚗','🚕'],['🐟','🐠'],['🌞','🌝'],['🟦','🟪'],['🧡','❤️'],['🐻','🐼']];
function qAtencao(){

const MEMO=['🐶','🐱','🐸','🐟','🍎','🍌','⭐','🚗','⚽','🏠','🌈','🎈','🚀','🦆','🍇','🐢'];
function qMemoria(){
  const specs=[{n:2,t:'any'},{n:2,t:'any'},{n:3,t:'first'},{n:3,t:'last'},{n:4,t:'last'},{n:4,t:'first'}];
  return specs.map(sp=>{
    const MP=hasInt()?INT_EMOJI[S.interest].concat(MEMO.slice(0,6)):MEMO;
    const seq=pick(MP,sp.n),rest=MP.filter(x=>seq.indexOf(x)<0);
    let ans,opts,ask,kind;
    if(sp.t==='any'){ans=seq[rand(seq.length)];opts=[ans].concat(pick(rest,3));ask='Qual figura estava na lista?';kind='reconhecer';}
    else if(sp.t==='first'){ans=seq[0];opts=seq.concat(pick(rest,Math.max(0,4-seq.length)));ask='Qual foi a primeira figura?';kind='primeira';}
    else{ans=seq[seq.length-1];opts=seq.concat(pick(rest,Math.max(0,4-seq.length)));ask='Qual foi a última figura?';kind='última';}
    return {dom:'mem',lab:'Memória de '+sp.n+' figuras ('+kind+')',ans:ans,memo:true,
      stem:`<div class="dots2">${seq.map(x=>`<span class="emo">${x}</span>`).join('')}</div><span class="stemtext">Olhe bem e guarde na memória.</span>`,
      hide:'<span class="emo xl">🤔</span>',prompt:ask,say:[{t:ask}],
      opts:shuffle(opts).map(x=>({lab:x,h:`<span class="emo">${x}</span>`,ok:x===ans})),cols:2};
  });
}
const PAT_E=['🔴','🔵','🟢','🟡','⭐','🌙','🐶','🐱'];
function qPadroes(){
  const E=shuffle(hasInt()?INT_EMOJI[S.interest].concat(['🔴','🔵','🟢']):PAT_E);
  const items=[
    {seq:[E[0],E[1],E[0],E[1],E[0]],ans:E[1],pool:[E[0],E[1],E[2],E[3]],lab:'Padrão AB'},
    {seq:[E[2],E[3],E[2],E[3],E[2]],ans:E[3],pool:[E[2],E[3],E[4],E[5]],lab:'Padrão AB'},
    {seq:[E[4],E[4],E[5],E[4],E[4]],ans:E[5],pool:[E[4],E[5],E[6],E[7]],lab:'Padrão AAB'},
    {seq:[E[0],E[1],E[2],E[0],E[1]],ans:E[2],pool:[E[0],E[1],E[2],E[3]],lab:'Padrão ABC'},
    {seq:[2,4,6,8],ans:10,pool:[9,10,12,7],lab:'Sequência de 2 em 2'},
    {seq:[5,10,15,20],ans:25,pool:[21,25,30,22],lab:'Sequência de 5 em 5'}
  ];
  return items.map(it=>({dom:'log',lab:it.lab+': '+it.seq.join(' ')+' ?',ans:it.ans,
    stem:`<div class="dots2">${it.seq.map(x=>`<span class="${typeof x==='number'?'bignum':'emo'}">${x}</span>`).join('')}<span class="${typeof it.ans==='number'?'bignum':'emo'}">❔</span></div>`,
    prompt:'O que vem depois? Descubra o padrão.',say:[{t:'O que vem depois? Descubra o padrão.'}],
    opts:shuffle(it.pool).map(x=>({lab:String(x),h:typeof x==='number'?`<span class="num">${x}</span>`:`<span class="emo">${x}</span>`,ok:x===it.ans})),cols:2}));
}

function qOpts(q,cfg){
  if(!S.fewOpts||cfg.assess||q.opts.length<=2)return q.opts;
  const ok=q.opts.filter(x=>x.ok).slice(0,1),bad=shuffle(q.opts.filter(x=>!x.ok)).slice(0,1);
  return shuffle(ok.concat(bad));
}
/* --- jogo de escolha (motor único, com registro de cada resposta) --- */
function quiz(m,cfg){
  const myView=view;
  const qs=cfg.make();let i=0,earned=0;
  let tried=false,locked=false,t0=0,tShow=0,tFirst=null,listens=0,wrong=[],memoMs=null,p0=0,lastEntry=null,supL=0;
  function entry(q,ok1,tries,err){
    const right=q.opts.find(x=>x.ok)||{};
    const e=logEntry({mod:cfg.module,act:cfg.key,dom:q.dom||'',lab:q.lab||strip(q.stem).slice(0,80),
      ans:q.ans!=null?String(q.ans):(right.lab||strip(right.h)),ok1:ok1,tries:tries,ms:tFirst,listens:listens,err:err,view:memoMs,sup:S.mediated?supL:undefined},
      cfg.assess&&SESS?SESS.id:null);
    lastEntry=e;
  }
  function show(){
    const q=qs[i];q.shown=qOpts(q,cfg);tried=false;locked=false;listens=0;wrong=[];memoMs=null;tFirst=null;supL=0;lastEntry=null;p0=PAUSED_MS;tShow=Date.now();t0=tShow;
    m.innerHTML=`<section class="play" style="--c:var(--c-${cfg.module})">${playbar(i,qs.length)}
    <div class="qcard"><div class="stem" id="qs">${q.stem}</div><p class="prompt" id="qp">${q.memo?'Quando estiver pronto, toque no botão.':(q.prompt||'')}</p>
    ${q.memo?'<button class="btn primary" id="memoBtn">Já memorizei</button>':''}
    <button class="listen" id="ql" aria-label="Ouvir de novo"${q.memo?' hidden':''}>${ICON.speaker}<span>Ouvir</span></button></div>
    <div class="opts c${q.cols||2}" id="qo"${q.memo?' hidden':''}>${q.shown.map((o,k)=>`<button class="opt" data-k="${k}">${o.h}</button>`).join('')}</div>
    <p class="fb" id="fb" role="status" aria-live="polite"></p>${S.mediated?supportHTML():''}</section>`;
    if(tokenOn()&&!cfg.assess)$('.playbar',m).insertAdjacentHTML('afterend',tokenBarHTML());
    $$('.supchip',m).forEach(c=>c.onclick=()=>{supL=+c.dataset.l;$$('.supchip',m).forEach(x=>x.classList.toggle('on',x===c));if(lastEntry)lastEntry.sup=supL,save();});
    $('#qb',m).onclick=()=>backTo.apply(null,cfg.back);
    $('#ql',m).onclick=()=>{listens++;say(q.say);};
    $$('.opt',m).forEach(b=>b.onclick=()=>choose(b,q));
    if(q.memo){
      $('#memoBtn',m).onclick=()=>{
        memoMs=Date.now()-tShow-(PAUSED_MS-p0);
        $('#qs',m).innerHTML=q.hide;$('#qp',m).textContent=q.prompt||'';
        $('#memoBtn',m).hidden=true;$('#qo',m).hidden=false;$('#ql',m).hidden=false;
        t0=Date.now();say(q.say);
      };
    }else if(S.auto==='all'||!q.noauto){
      setTimeout(()=>{if(view===myView)say(q.say);},300);
    }
  }
  function next(){if(view!==myView)return;i++;if(i>=qs.length)finish();else show();}
  function choose(b,q){
    if(locked||b.disabled)return;
    const o=q.shown[+b.dataset.k],fb=$('#fb',m),olab=o.lab||strip(o.h);
    if(tFirst===null)tFirst=Math.max(0,Date.now()-t0-(PAUSED_MS-p0));
    if(cfg.assess){
      locked=true;b.classList.add('picked');$$('.opt',m).forEach(x=>{x.disabled=true;});
      sfx.tap();if(o.ok)earned++;
      entry(q,!!o.ok,1,o.ok?[]:[olab]);
      const msg='Muito bem! Vamos continuar.';
      fb.textContent=msg;fb.className='fb good';say({t:msg});
      setTimeout(next,S.mediated?3600:1400);return;
    }
    if(o.ok){
      locked=true;b.classList.add('right');
      $$('.opt',m).forEach(x=>{if(x!==b)x.disabled=true;});
      sfx.ok();
      if(!tried&&S.reinf==='stars')confetti();
      let msg=praise();
      let full=false;
      if(!tried){earned++;addStars(1);if(tokenOn()){full=tokenAdd();refreshTokens(m);}}else msg='Isso! Agora você acertou.';
      entry(q,!tried,wrong.length+1,wrong.slice());
      fb.textContent=msg;fb.className='fb good';
      say((q.after||[]).concat([{t:msg}]));
      if(full)setTimeout(()=>{if(view===myView)showReward();},1000);
      setTimeout(()=>{if(PAUSED){const w=setInterval(()=>{if(!PAUSED){clearInterval(w);next();}},300);}else next();},2100+((q.after||[]).length>1?800:0)+(S.mediated?1500:0));
    }else{
      tried=true;wrong.push(olab);b.classList.add('wrong');b.disabled=true;sfx.bad();
      fb.textContent='Quase! Tente outra vez.';fb.className='fb try';
      say({t:'Tente outra vez.'});
    }
  }
  function finish(){
    if(cfg.onDone){cfg.onDone(earned,qs.length);return;}
    result(m,{module:cfg.module,key:cfg.key,earned:earned,total:qs.length,again:()=>quiz(m,cfg),back:cfg.back});
  }
  show();
}

function syllables(m){
  const myView=view;const words=pick(SYL,6);let i=0,earned=0;
  function show(){
    const w=words[i];let filled=0,mistakes=false,locked=false;
    const word=w.s.join('').toLowerCase();
    const extra=pick(SYLPOOL.filter(x=>w.s.indexOf(x)<0),1);
    const tiles=shuffle(w.s.concat(extra)).map(t=>({t:t,used:false}));
    m.innerHTML=`<section class="play" style="--c:var(--c-letras)">${playbar(i,words.length)}
    <div class="qcard"><div class="stem"><span class="emo xl">${w.e}</span></div><p class="prompt">Toque nas sílabas na ordem certa.</p>
    <div class="slots">${w.s.map(()=>'<span class="slot w"></span>').join('')}</div>
    <button class="listen" id="ql">${ICON.speaker}<span>Ouvir</span></button></div>
    <div class="sylrow">${tiles.map((t,k)=>`<button class="syl w" data-k="${k}">${t.t}</button>`).join('')}</div>
    <p class="fb" id="fb" role="status" aria-live="polite"></p></section>`;
    $('#qb',m).onclick=()=>backTo('menu','letras');
    $('#ql',m).onclick=()=>say({t:word});
    const fb=$('#fb',m);
    $$('.syl',m).forEach(b=>b.onclick=()=>{
      if(locked)return;
      const t=tiles[+b.dataset.k];if(t.used)return;
      if(t.t===w.s[filled]){
        t.used=true;b.disabled=true;b.classList.add('used');
        const sl=$$('.slot',m)[filled];sl.textContent=t.t;sl.classList.add('on');
        filled++;sfx.tap();
        if(filled===w.s.length){
          locked=true;sfx.ok();
          let msg=praise();
          if(!mistakes){earned++;addStars(1);}else msg='Isso! Palavra completa.';
          fb.textContent=msg;fb.className='fb good';
          say([{t:word},{t:msg}]);
          setTimeout(()=>{if(view!==myView)return;i++;if(i<words.length)show();else result(m,{module:'letras',key:'letras:silabas',earned:earned,total:words.length,again:()=>syllables(m),back:['menu','letras']});},2200);
        }
      }else{
        mistakes=true;sfx.bad();
        b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');
        b.addEventListener('animationend',()=>b.classList.remove('wrong'),{once:true});
        fb.textContent='Essa não é a próxima. Tente outra!';fb.className='fb try';
      }
    });
    setTimeout(()=>{if(view===myView)say({t:word});},300);
  }
  show();
}

const scenes=()=>[SKIN_SCENES[S.skin==='algodao'?'algodao':'aventura']].concat(SCENES);
let sceneIdx=0;
function puzzle(m,cols,rows,key,opt){
  opt=opt||{};
  const myView=view;
  const list=scenes();
  const sc=opt.scene||list[sceneIdx%list.length];
  const uri='data:image/svg+xml;utf8,'+encodeURIComponent(sc.svg);
  const n=cols*rows;
  let order;do{order=shuffle(Array.from({length:n},(_,i)=>i));}while(order.every((v,i)=>v===i));
  let sel=-1,moves=0,done=false;
  const tStart=Date.now(),p0=PAUSED_MS;
  const minSw=(()=>{const seen=new Array(n).fill(false);let cyc=0;for(let s=0;s<n;s++){if(!seen[s]){cyc++;let x=s;while(!seen[x]){seen[x]=true;x=order[x];}}}return n-cyc;})();
  m.innerHTML=`${opt.assess?backBtn('aval'):backBtn('menu','puzzle')}<h2 class="mtitle" style="--c:var(--c-puzzle)">${esc(sc.n)}</h2>
  <p class="msub">Toque em duas peças para trocar de lugar. Peça no lugar certo ganha borda verde.</p>
  <div class="pz"><div class="board" id="board"></div><div class="pzside"><div class="thumb" id="thumb" role="img" aria-label="Imagem de referência"></div><p class="mv" id="mv">Trocas: 0</p></div></div><div id="pzEnd"></div>`;
  $('#thumb',m).style.backgroundImage='url("'+uri+'")';
  const board=$('#board',m);
  board.style.gridTemplateColumns='repeat('+cols+',1fr)';
  board.style.gridTemplateRows='repeat('+rows+',1fr)';
  const btns=[];
  for(let p=0;p<n;p++){
    const b=document.createElement('button');
    b.type='button';b.className='ptile';b.setAttribute('aria-label','Peça '+(p+1));
    b.style.backgroundImage='url("'+uri+'")';
    b.style.backgroundSize=(cols*100)+'% '+(rows*100)+'%';
    b.onclick=()=>tap(p);
    board.appendChild(b);btns.push(b);
  }
  function paint(){
    btns.forEach((b,p)=>{
      const id=order[p],x=id%cols,y=Math.floor(id/cols);
      b.style.backgroundPosition=(cols>1?x/(cols-1)*100:0)+'% '+(rows>1?y/(rows-1)*100:0)+'%';
      b.classList.toggle('sel',p===sel);
      b.classList.toggle('fit',id===p);
    });
  }
  function tap(p){
    if(done)return;
    sfx.tap();
    if(sel<0){sel=p;}
    else if(sel===p){sel=-1;}
    else{const t=order[sel];order[sel]=order[p];order[p]=t;sel=-1;moves++;$('#mv',m).textContent='Trocas: '+moves;}
    paint();
    if(order.every((v,i)=>v===i))win();
  }
  function win(){
    done=true;board.classList.add('solved');
    sfx.win();if(!opt.assess&&S.reinf==='stars')confetti();
    logEntry({mod:'puzzle',act:key,dom:'viso',lab:'Quebra-cabeça de '+n+' peças',ans:'',ok1:null,tries:1,ms:Date.now()-tStart-(PAUSED_MS-p0),listens:0,err:[],pieces:n,moves:moves,minMoves:minSw},opt.assess&&SESS?SESS.id:null);
    if(opt.assess){
      say({t:'Muito bem! Vamos continuar.'});
      $('#pzEnd',m).innerHTML='<div class="endcard"><b>Muito bem!</b><div class="row"><button class="btn primary" id="pzCont">Continuar</button></div></div>';
      $('#pzCont',m).onclick=()=>{sfx.tap();opt.onDone();};
      return;
    }
    const st=n>=9?5:n>=6?3:2;
    addStars(st);S.rounds[key]=(S.rounds[key]||0)+1;markToday('puzzle');save();
    const tkFull=tokenOn()&&(tokenAdd(),P.tokens.n>=S.goalTokens);
    say({t:'Parabéns! Você montou o quebra-cabeça!'});
    if(tkFull)setTimeout(showReward,1200);
    $('#pzEnd',m).innerHTML=`<div class="endcard" style="--c:var(--c-puzzle)"><b>Muito bem!${S.reinf==='stars'?' +'+st+' estrelas':''}</b><div class="row"><button class="btn primary" id="pzNext">Outro quebra-cabeça</button><button class="btn" id="pzMenu">Voltar ao menu</button></div></div>`;
    $('#pzNext',m).onclick=()=>{sfx.tap();sceneIdx++;if(view===myView)puzzle(m,cols,rows,key);};
    $('#pzMenu',m).onclick=()=>{sfx.tap();backTo('menu','puzzle');};
  }
  paint();
}
ACTS['puzzle:p1']=m=>puzzle(m,2,2,'puzzle:p1');

  const f=$('#pform'),name=$('#pf-name').value.trim();

  const vals={name:name,birth:$('#pf-birth').value,grade:$('#pf-grade').value,notes:$('#pf-notes').value.trim(),skin:normSkin(f.dataset.skin)};
  const id=f.dataset.id;
  if(id){
    const p=S.profiles.find(x=>x.id===id);Object.assign(p,vals);save();

    backTo('parents');

  }
};

actions.confirmYes=()=>{
  const id=$('#pform').dataset.id,p=S.profiles.find(x=>x.id===id);
  if(!p)return;
  if(CONFIRM==='clear'){p.log=[];p.sessions=[];p.rep={by:'',obs:'',beh:''};save();backTo('parents');}
  else if(CONFIRM==='del'){
    S.profiles=S.profiles.filter(x=>x.id!==id);
    if(P&&P.id===id){P=null;S.cur=null;if(S.profiles.length)setProfile(S.profiles[0].id);}
    save();backTo(S.profiles.length?'parents':'who');
  }
  CONFIRM=null;
};

    ${BLOCKS.map(b=>`<label class="chk"><input type="checkbox" id="b-${b.k}" checked><span>${esc(b.t)}<small>${b.n} ${b.n===1?'item':'itens'}</small></span></label>`).join('')}

actions.avform=b=>{AV.form=b.dataset.v;$$('[data-act="avform"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};
actions.avstart=()=>{
  const keys=BLOCKS.filter(b=>{const c=$('#b-'+b.k);return c&&c.checked;}).map(b=>b.k);
  if(!keys.length){$('#avErr').hidden=false;return;}
  const sess={id:'s'+Date.now().toString(36),ts:Date.now(),form:AV.form,blocks:keys,done:false};
  P.sessions.push(sess);save();SESS=sess;go('avalrun',{i:0});
};
screens.avalrun=(m,arg)=>{
  if(!P||!SESS)return go('aval');
  const i=arg&&arg.i||0,keys=SESS.blocks;
  if(i>=keys.length){

    m.innerHTML=`<section class="result" style="--c:var(--c-letras)"><div class="medal">${mascot('cheer')}</div><h2>Terminamos! Muito obrigado!</h2>

    $('#vr',m).onclick=()=>go('report',{sel:SESS.id});
    $('#vh',m).onclick=()=>go('home');

  }
  const B=BLOCKS.find(b=>b.k===keys[i]);
  m.innerHTML=`<section class="result" style="--c:var(--c-${B.mod})"><p class="score">Parte ${i+1} de ${keys.length}</p><h2>${esc(B.intro)}</h2>
  <p class="msub" style="text-align:center">${esc(B.t)}</p>
  <div class="row"><button class="btn primary" id="go1">Começar</button><button class="btn" id="stop1">Parar por hoje</button></div></section>`;
  say({t:B.intro});
  $('#stop1',m).onclick=()=>{stopSpeech();backTo('aval');};
  $('#go1',m).onclick=()=>{
    sfx.tap();stopSpeech();
    const onDone=()=>go('avalrun',{i:i+1},{replace:true});
    if(B.puzzle)puzzle(m,2,2,'aval:'+B.k,{assess:true,scene:SCENES[0],onDone:onDone});

  };
};

/* ========== relatório ========== */
const DOMS=[['letra','Reconhecimento de letras'],['fon','Consciência fonológica (letra inicial)'],['silc','Consciência silábica'],['ler','Leitura de palavras'],
  ['comp','Compreensão de frases e histórias'],['calc','Cálculo'],['aten','Atenção visual'],['mem','Memória de trabalho visual'],
  ['log','Padrões e raciocínio lógico'],['viso','Quebra-cabeça (visuoespacial)'],['ing','Inglês (vocabulário)']];
const BAND={insuf:'Poucos itens',aut:'Com autonomia',des:'Em desenvolvimento',apo:'Precisa de apoio'};
const band=(n,p)=>n<3?'insuf':p>=80?'aut':p>=50?'des':'apo';
const median=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),h=Math.floor(s.length/2);return s.length%2?s[h]:(s[h-1]+s[h])/2;};
const fmtS=ms=>ms==null?'–':(ms/1000).toFixed(1).replace('.',',')+' s';
const fmtMin=ms=>ms<60000?Math.max(1,Math.round(ms/1000))+' s':Math.round(ms/60000)+' min';
const fmtDate=ts=>new Date(ts).toLocaleDateString('pt-BR');
const isItem=e=>e.ok1!==null&&e.ok1!==undefined;
const domName=k=>(DOMS.find(d=>d[0]===k)||['',k])[1];
function ageText(b){
  if(!b)return '';
  const d=new Date(b+'T00:00:00');if(isNaN(d))return '';
  const n=new Date();let y=n.getFullYear()-d.getFullYear(),mo=n.getMonth()-d.getMonth();
  if(n.getDate()<d.getDate())mo--;
  if(mo<0){y--;mo+=12;}
  if(y<0)return '';
  return y+' anos'+(mo?' e '+mo+(mo===1?' mês':' meses'):'');
}
function stats(E){
  const out=[];
  DOMS.forEach(d=>{
    const it=E.filter(e=>e.dom===d[0]&&isItem(e));
    if(!it.length)return;
    const c=it.filter(e=>e.ok1).length;
    out.push({k:d[0],name:d[1],n:it.length,c:c,p:Math.round(100*c/it.length),
      ms:median(it.map(e=>e.ms).filter(x=>typeof x==='number')),ou:it.filter(e=>e.listens>0).length,
      supN:it.filter(e=>e.sup!=null).length,sup:it.filter(e=>e.sup>0).length,b:band(it.length,100*c/it.length)});
  });
  return out;
}
function observations(E,st){
  const o=[],ok=st.filter(s=>s.n>=3);
  const low=ok.filter(s=>s.p<50).map(s=>s.name+' ('+s.p+'%)');
  const high=ok.filter(s=>s.p>=80).map(s=>s.name+' ('+s.p+'%)');
  if(low.length)o.push('Áreas com mais respostas incorretas na 1ª tentativa: '+low.join('; ')+'.');
  if(high.length)o.push('Áreas realizadas com autonomia: '+high.join('; ')+'.');
  const mAll=median(E.filter(e=>isItem(e)&&typeof e.ms==='number').map(e=>e.ms));
  if(mAll){
    const slow=st.filter(s=>s.n>=3&&s.ms!=null&&s.ms>mAll*1.6).map(s=>s.name+' ('+fmtS(s.ms)+')');
    o.push('Tempo mediano de resposta: '+fmtS(mAll)+(slow.length?'. Mais lento em: '+slow.join('; ')+'.':'.'));
  }
  const it=E.filter(isItem);
  if(it.length)o.push('Usou o botão Ouvir em '+Math.round(100*it.filter(e=>e.listens>0).length/it.length)+'% dos itens.');
  const sN=it.filter(e=>e.sup!=null);
  if(sN.length){
    const s1=sN.filter(e=>e.sup>0).length;
    const more=st.filter(s=>s.supN>=3&&s.sup/s.supN>=0.5).map(s=>s.name);
    o.push('Apoio do adulto registrado em '+sN.length+' itens: '+s1+' com dica ou ajuda ('+Math.round(100*s1/sN.length)+'%).'+(more.length?' Mais apoio em: '+more.join('; ')+'.':''));
  }
  const multi=E.filter(e=>!e.sid&&isItem(e)&&e.tries>1).length;
  if(multi)o.push('Na prática livre, precisou de mais de uma tentativa em '+multi+' itens.');
  const pz=E.filter(e=>e.mod==='pausa');
  if(pz.length)o.push('Pediu pausa '+pz.length+(pz.length===1?' vez':' vezes')+' (tempo total: '+fmtMin(pz.reduce((a,e)=>a+(e.ms||0),0))+').');
  const pairs=[['B','D'],['P','Q'],['M','N'],['F','V'],['T','D'],['C','G'],['S','Z']];
  const conf=E.filter(e=>e.ok1===false&&(e.dom==='letra'||e.dom==='fon')&&e.err&&e.err.length&&pairs.some(p=>(p[0]===e.ans&&p[1]===e.err[0])||(p[1]===e.ans&&p[0]===e.err[0])));
  if(conf.length)o.push('Troca entre letras de grafia ou som parecidos em '+conf.length+' item(ns) (por exemplo b/d, p/q, m/n, f/v). Vale observar com atenção.');
  return o;
}
const selEntries=sel=>sel==='all'?P.log:sel==='free'?P.log.filter(e=>!e.sid):P.log.filter(e=>e.sid===sel);
function repSel(arg){
  if(arg&&arg.sel)return arg.sel;
  const ss=P.sessions.filter(s=>P.log.some(e=>e.sid===s.id));
  return ss.length?ss[ss.length-1].id:'all';
}

/* evolução entre aplicações e metas */
const guidedSessions=()=>P.sessions.filter(s=>P.log.some(e=>e.sid===s.id&&isItem(e)));
function evolution(){
  const cols=guidedSessions().slice(-6).map(s=>({s:s,st:stats(P.log.filter(e=>e.sid===s.id))}));
  const rows=DOMS.map(d=>({name:d[1],v:cols.map(c=>{const x=c.st.find(y=>y.k===d[0]);return x?{p:x.p,n:x.n}:null;})})).filter(r=>r.v.some(Boolean));
  return {cols:cols,rows:rows};
}
function goalSeries(g){
  if(!g.dom)return [];
  return guidedSessions().map(s=>{
    const it=P.log.filter(e=>e.sid===s.id&&e.dom===g.dom&&isItem(e));
    if(!it.length)return null;
    return {ts:s.ts,p:Math.round(100*it.filter(e=>e.ok1&&!(e.sup>0)).length/it.length),n:it.length};
  }).filter(Boolean);
}
function goalStatus(g){
  if(!g.dom)return ({iniciar:'Não iniciada',andamento:'Em andamento',atingida:'Atingida'})[g.status||'iniciar'];
  const s=goalSeries(g);
  if(!s.length)return 'Sem aplicação ainda';
  const l=s[s.length-1];
  return l.n<3?'Poucos itens':l.p>=g.target?'Atingida':'Em andamento';
}

function buildReport(sel){
  const E=selEntries(sel),st=stats(E),ts=E.map(e=>e.ts);
  return {sel:sel,E:E,st:st,sess:P.sessions.find(s=>s.id===sel)||null,
    errs:E.filter(e=>e.ok1===false).map(e=>({dom:domName(e.dom),lab:e.lab,got:(e.err||[]).join(', '),ans:e.ans})),
    puz:E.filter(e=>e.dom==='viso'),obs:observations(E,st),pauses:E.filter(e=>e.mod==='pausa'),
    from:ts.length?Math.min.apply(null,ts):null,to:ts.length?Math.max.apply(null,ts):null,total:E.filter(isItem).length};
}
function modeText(R){
  if(R.sess)return 'Avaliação guiada, Forma '+R.sess.form+', de '+fmtDate(R.sess.ts)+'. Uma tentativa por item e sem informar acerto ou erro à criança.'+(R.sess.done?'':' Aplicação parcial.');
  if(R.sel==='free')return 'Prática livre. A criança pode tentar de novo até acertar; o relatório considera só a 1ª tentativa.';
  return 'Todos os registros (avaliações guiadas e prática livre). A prática livre permite novas tentativas; o relatório considera só a 1ª tentativa.';
}
function sessionRows(){
  return P.sessions.filter(s=>P.log.some(e=>e.sid===s.id)).map(s=>({
    date:fmtDate(s.ts),form:s.form,parts:s.blocks.map(k=>(BLOCKS.find(b=>b.k===k)||{t:k}).t).join(', '),
    n:P.log.filter(e=>e.sid===s.id&&isItem(e)).length,done:s.done}));
}

    const el=$('#'+a[1],m),pn=$('#'+a[2],m);
    el.oninput=()=>{P.rep[a[0]]=el.value;pn.textContent=el.value;save();};
  });
};
actions.print=()=>{try{window.print();}catch(e){}};
actions.copy=()=>{
  const t=reportText(buildReport(RSEL)),box=$('#copyBox');
  const fb=()=>{box.hidden=false;box.value=t;box.focus();box.select();};
  try{navigator.clipboard.writeText(t).then(()=>{const b=$('[data-act="copy"]');if(b)b.textContent='Copiado!';},fb);}catch(e){fb();}
};
actions.csv=()=>{
  const rows=[['data_hora','aplicacao','forma','modulo','atividade','area','item','resposta_esperada','acertou_1a_tentativa','tentativas','tempo_ms','usos_ouvir','apoio_0sozinha_1dica_2ajuda','respostas_erradas','pecas','trocas','trocas_minimas']];
  selEntries(RSEL).forEach(e=>{
    const s=P.sessions.find(x=>x.id===e.sid);
    rows.push([new Date(e.ts).toLocaleString('pt-BR'),s?fmtDate(s.ts):'pratica livre',s?s.form:'',e.mod,e.act,e.dom,e.lab,e.ans,
      isItem(e)?(e.ok1?'sim':'nao'):'',e.tries,e.ms,e.listens,e.sup==null?'':e.sup,(e.err||[]).join(' | '),e.pieces||'',e.moves==null?'':e.moves,e.minMoves==null?'':e.minMoves]);
  });
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  try{
    const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='registro-'+P.name.replace(/\W+/g,'-')+'.csv';
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
};

  <details class="panel"><summary><h3>Pausa e rotina visual</h3></summary>

  <h3>Rotina de hoje (primeiro, depois)</h3>

  <details class="panel"><summary><h3>Interesses e reforço</h3></summary>

  <details class="panel"><summary><h3>Apoio do adulto e atividades</h3></summary>

  <details class="panel"><summary><h3>Tema deste aluno</h3></summary><div class="seg">

function syncAdult(){
  $$('[data-act="pref"]').forEach(b=>b.setAttribute('aria-pressed',String(!!S[b.dataset.k])));
  $$('[data-act="setpref"]').forEach(b=>b.setAttribute('aria-pressed',String(JSON.stringify(S[b.dataset.k])===b.dataset.v)));
  $$('[data-act="rt"]').forEach(b=>{const i=P.routine.indexOf(b.dataset.k);b.setAttribute('aria-pressed',String(i>=0));b.textContent=(i>=0?(i+1)+'. ':'')+b.dataset.l;});
  $$('[data-act="skin"]').forEach(b=>b.setAttribute('aria-pressed',String(P.skin===b.dataset.v)));
  const v=$('#vol');if(v)v.value=S.vol;
}

actions.defaults=()=>{['fx','conf','anim','masc','dots','vol'].forEach(k=>{S[k]=DEFAULT_PREFS[k];});save();applyPrefs();syncAdult();};
actions.rt=b=>{const k=b.dataset.k,i=P.routine.indexOf(k);if(i>=0)P.routine.splice(i,1);else if(P.routine.length<6)P.routine.push(k);save();syncAdult();};
actions.rtClear=()=>{P.routine=[];save();syncAdult();};
actions.tokReset=()=>{P.tokens.n=0;save();};

  ${P.goals.length?P.goals.map(g=>`<div class="goal"><div><b>${esc(g.text)}</b><small>${g.dom?esc(domName(g.dom))+' · meta '+g.target+'%':'Acompanhamento manual'} · ${esc(stat(g))}</small></div>
    ${g.dom?'':`<select class="inp gst" data-id="${esc(g.id)}" aria-label="Situação da meta"><option value="iniciar"${g.status==='iniciar'||!g.status?' selected':''}>Não iniciada</option><option value="andamento"${g.status==='andamento'?' selected':''}>Em andamento</option><option value="atingida"${g.status==='atingida'?' selected':''}>Atingida</option></select>`}
    <button class="chip" data-act="gdel" data-id="${esc(g.id)}">Remover</button></div>`).join(''):'<p>Nenhuma meta cadastrada ainda.</p>'}</div>`;
  $$('.gst',m).forEach(s=>s.onchange=()=>{const g=P.goals.find(x=>x.id===s.dataset.id);if(g){g.status=s.value;save();}});

actions.gadd=()=>{
  const t=$('#g-text').value.trim();
  if(!t){$('#g-err').hidden=false;$('#g-text').focus();return;}
  P.goals.push({id:'g'+Date.now().toString(36),text:t,dom:$('#g-dom').value,target:+$('#g-tg').value,status:'iniciar',created:Date.now()});
  save();screens.metas($('#main'));
};
actions.gdel=b=>{P.goals=P.goals.filter(g=>g.id!==b.dataset.id);save();screens.metas($('#main'));};
